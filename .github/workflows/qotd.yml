name: Daily Question of the Day

on:
  schedule:
    # Every day at 12:00 UTC
    # 8:00 PM Philippines time
    - cron: "0 12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  qotd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate and post QOTD
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python qotd.py

      - name: Save question history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/used_questions.json

          if git diff --cached --quiet; then
            echo "No question history changes."
          else
            git commit -m "Update QOTD question history"
            git push
          fi
