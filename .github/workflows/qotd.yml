name: Question of the Day

on:
  schedule:
    - cron: '0 12 * * *'

  workflow_dispatch:
    inputs:
      duration:
        description: 'QOTD countdown duration in minutes'
        required: true
        default: '10'
        type: string

permissions:
  contents: write

jobs:
  qotd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Determine QOTD duration
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_DURATION: ${{ inputs.duration }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DURATION="$MANUAL_DURATION"

            echo "Manual duration selected: $DURATION minutes"

            echo "$DURATION" > qotd_duration.txt

          else
            if [ -f qotd_duration.txt ]; then
              DURATION=$(cat qotd_duration.txt)

              echo "Using previously saved duration: $DURATION minutes"
            else
              DURATION="10"

              echo "No saved duration found."
              echo "Using default: $DURATION minutes"

              echo "$DURATION" > qotd_duration.txt
            fi
          fi

          echo "QOTD_DURATION=$DURATION" >> "$GITHUB_ENV"

      - name: Run Question of the Day
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          QOTD_DURATION: ${{ env.QOTD_DURATION }}
        run: |
          python qotd.py

      - name: Save duration for future QOTDs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add qotd_duration.txt

            if git diff --cached --quiet; then
              echo "Duration did not change."
            else
              git commit -m "Update QOTD duration"
              git push
            fi
          fi
