name: Daily Question of the Day

on:
  schedule:
    # 9:17 AM Philippines time every day
    - cron: "17 9 * * *"
      timezone: "Asia/Manila"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-qotd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Send Question of the Day
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python qotd.py

      - name: Save used question database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/used_questions.json

          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Update QOTD question database"
            git push
          fi
