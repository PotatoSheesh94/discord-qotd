name: Daily Question of the Day

on:
  schedule:
    - cron: "0 12 * * *"

  workflow_dispatch:
    inputs:
      duration:
        description: "How many minutes should the QOTD last?"
        required: true
        default: "10"
        type: string

permissions:
  contents: write

jobs:
  qotd:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Set QOTD duration
        shell: bash
        env:
          MANUAL_DURATION: ${{ inputs.duration }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "QOTD_DURATION=$MANUAL_DURATION" >> "$GITHUB_ENV"
            echo "Manual QOTD duration: $MANUAL_DURATION minutes"
          else
            echo "QOTD_DURATION=10" >> "$GITHUB_ENV"
            echo "Scheduled QOTD duration: 10 minutes"
          fi

      - name: Show duration
        run: |
          echo "QOTD_DURATION=$QOTD_DURATION"

      - name: Run Question of the Day
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          QOTD_DURATION: ${{ env.QOTD_DURATION }}
        run: |
          python qotd.py

      - name: Save QOTD database
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Update QOTD database"
            git push
          fi
